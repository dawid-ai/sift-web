<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 216" width="384" height="216" role="presentation">
<rect width="384" height="216" fill="#F4F1EC"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="26" y="34" font-size="17" font-weight="700" fill="#1D1916">Buy less, more often</text>
<line x1="26" y1="46" x2="358" y2="46" stroke="#D8D2C9" stroke-width="1"/>
<text x="26" y="98" font-size="26" font-weight="700" fill="#1D1916">The big shop</text>
<text x="26" y="126" font-size="14" fill="#B4643A">is where the waste is decided.</text>
<text x="26" y="162" font-size="9.5" fill="#8A8078">Three small shops a week beat one big one, and it is not close.</text>
<text x="26" y="178" font-size="9.5" fill="#8A8078">Nobody plans nine days of dinners correctly. Nobody.</text>
<text x="26" y="200" font-size="8.5" letter-spacing="0.12em" fill="#8A8078">THE LECTURE ROOM</text>
</g>
</svg>
