<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 216" width="384" height="216" role="presentation">
<rect width="384" height="216" fill="#F4F1EC"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="26" y="34" font-size="17" font-weight="700" fill="#1D1916">What we changed, in one house</text>
<line x1="26" y1="46" x2="358" y2="46" stroke="#D8D2C9" stroke-width="1"/>
<text x="26" y="76" font-size="11" font-weight="700" fill="#B4643A">1</text>
<text x="46" y="76" font-size="11" fill="#4A443E">Turned the fridge down two degrees.</text>
<text x="26" y="102" font-size="11" font-weight="700" fill="#4A443E">2</text>
<text x="46" y="102" font-size="11" fill="#4A443E">One shelf for things that need eating first.</text>
<text x="26" y="128" font-size="11" font-weight="700" fill="#4A443E">3</text>
<text x="46" y="128" font-size="11" fill="#4A443E">Bread straight into the freezer, sliced.</text>
<text x="26" y="154" font-size="11" font-weight="700" fill="#4A443E">4</text>
<text x="46" y="154" font-size="11" fill="#4A443E">Stopped buying salad in bags entirely.</text>
<text x="26" y="180" font-size="9.5" fill="#8A8078">None of it took longer than an evening.</text>
<text x="26" y="200" font-size="8.5" letter-spacing="0.12em" fill="#8A8078">THE LECTURE ROOM</text>
</g>
</svg>
