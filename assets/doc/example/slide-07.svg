<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 216" width="384" height="216" role="presentation">
<rect width="384" height="216" fill="#F4F1EC"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="26" y="34" font-size="17" font-weight="700" fill="#1D1916">Your fridge is probably too warm</text>
<line x1="26" y1="46" x2="358" y2="46" stroke="#D8D2C9" stroke-width="1"/>
<line x1="40" y1="112" x2="352" y2="112" stroke="#D8D2C9" stroke-width="2"/>
<circle cx="122" cy="112" r="6" fill="#B4643A"/>
<text x="122" y="94" font-size="10" text-anchor="middle" fill="#B4643A">5&#176;C</text>
<text x="122" y="134" font-size="8.5" text-anchor="middle" fill="#8A8078">where it should be</text>
<circle cx="252" cy="112" r="6" fill="#8A8078"/>
<text x="252" y="94" font-size="10" text-anchor="middle" fill="#4A443E">7&#176;C</text>
<text x="252" y="134" font-size="8.5" text-anchor="middle" fill="#8A8078">where most of them are</text>
<text x="26" y="176" font-size="9.5" fill="#8A8078">Two degrees is about three days on a bag of salad.</text>
<text x="26" y="200" font-size="8.5" letter-spacing="0.12em" fill="#8A8078">THE LECTURE ROOM</text>
</g>
</svg>
