<g font-family="Helvetica, Arial, sans-serif">
<text x="26" y="34" font-size="17" font-weight="700" fill="#1D1916">Use by is the one that means it</text>
<line x1="26" y1="46" x2="358" y2="46" stroke="#D8D2C9" stroke-width="1"/>
<rect x="26" y="66" width="332" height="66" rx="4" fill="#F6E4D8" stroke="#B4643A" stroke-width="1.6"/>
<text x="192" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#B4643A">Meat. Fish. Anything already cooked.</text>
<text x="192" y="116" font-size="9.5" text-anchor="middle" fill="#8A8078">The only date on the packet about whether it is safe.</text>
<text x="26" y="162" font-size="9.5" fill="#8A8078">Freeze it on the day and the date stops counting.</text>
<text x="26" y="200" font-size="8.5" letter-spacing="0.12em" fill="#8A8078">THE LECTURE ROOM</text>
